name: Build Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Kodu Repodan Çek
        uses: actions/checkout@v4

      - name: Theos'u Kur (SDK olmadan)
        uses: Randomblock1/theos-action@v1
        with:
          # SDK indirme kısmını devre dışı bırakıyoruz, manuel yapacağız
          theos-sdks: ''

      - name: SDK'ları Manuel İndir ve Çıkart
        run: |
          cd $THEOS
          # SDK'yı indir
          curl -L -o master.zip https://codeload.github.com/theos/sdks/zip/refs/heads/master
          # İzin hatasını önlemek için zip'i doğrudan çıkart
          unzip -q master.zip
          # Klasörü sdks olarak yeniden adlandır
          mv sdks-master sdks
          rm master.zip
          # İçeriği kontrol et
          ls -la sdks/

      - name: Projeyi Derle (Paket Oluştur)
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Derlenen Dosyaları Yükle
        uses: actions/upload-artifact@v4
        with:
          name: derlenmis-tweak
          path: |
            packages/*.deb
            .theos/obj/**/*.dylib
            *.dylib
          if-no-files-found: warn
