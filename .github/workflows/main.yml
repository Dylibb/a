name: Build Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Kodu Repodan Çek
        uses: actions/checkout@v4

      - name: Theos ve SDK'ları Manuel Kur
        run: |
          # 1. Theos'u klonla
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          
          # 2. SDK'ları .zip yerine .tar.gz (sıkıştırılmış arşiv) olarak indir
          # Bu yöntem, macOS sunucusundaki "symlink error: Permission denied" hatasını engeller.
          cd $HOME/theos
          echo "SDK indiriliyor..."
          curl -L -o sdks.tar.gz https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          
          # 3. Arşivi tar ile çıkart
          tar -xzf sdks.tar.gz
          mv sdks-master sdks
          rm sdks.tar.gz
          
          # 4. Ortam değişkenlerini ayarla
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: SDK Kontrolü (İsteğe Bağlı)
        run: |
          echo "İndirilen SDK'lar:"
          ls -l $HOME/theos/sdks/
          echo "THEOS değişkeni: $THEOS"

      - name: Projeyi Derle (Paket Oluştur)
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Derlenen Dosyaları Yükle
        uses: actions/upload-artifact@v4
        with:
          name: derlenmis-tweak
          path: |
            packages/*.deb
            .theos/obj/**/*.dylib
            *.dylib
          if-no-files-found: warn
