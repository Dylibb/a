name: Build Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Kodu Repodan Çek
        uses: actions/checkout@v4

      - name: Theos ve SDK'ları Manuel Kur
        run: |
          # Theos'u klonla
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          
          # SDK'ları indir ve doğru klasöre çıkart
          cd $HOME/theos
          echo "SDK indiriliyor..."
          curl -L -o sdks.zip https://codeload.github.com/theos/sdks/zip/refs/heads/master
          unzip -q sdks.zip
          mv sdks-master sdks
          rm sdks.zip
          
          # Theos yolunu ortam değişkenlerine ekle
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: SDK Kontrolü
        run: |
          echo "İndirilen SDK'lar:"
          ls -l $HOME/theos/sdks/
          echo "THEOS değişkeni: $THEOS"

      - name: Projeyi Derle (Paket Oluştur)
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Derlenen Dosyaları Yükle
        uses: actions/upload-artifact@v4
        with:
          name: derlenmis-tweak
          path: |
            packages/*.deb
            .theos/obj/**/*.dylib
            *.dylib
          if-no-files-found: warn
