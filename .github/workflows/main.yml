name: Build Dylib Only

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Kodu Repodan Çek
        uses: actions/checkout@v4

      - name: Theos, SDK ve ldid Kur
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          cd $HOME/theos
          curl -L -o sdks.tar.gz https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar -xzf sdks.tar.gz
          mv sdks-master sdks
          rm sdks.tar.gz
          
          curl -L -o /tmp/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64
          chmod +x /tmp/ldid
          sudo mv /tmp/ldid /usr/local/bin/ldid
          
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Projeyi Derle (Sadece Dylib)
        run: |
          make clean
          make
          
          # Dylib'in oluştuğu yeri bul ve packages klasörüne kopyala
          mkdir -p packages
          find .theos/obj -name "*.dylib" -exec cp {} packages/ \;

      - name: Dylib Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: M7MD-Dylib
          path: packages/*.dylib
          if-no-files-found: error
